<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Python Course | AI Learning Platform</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #10111f;
    color: #f5f5f7;
}

/* ================= HEADER ================= */

header {
    height: 70px;
    background: #17182b;
    border-bottom: 1px solid #292a43;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 25px;

    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    font-size: 20px;
    font-weight: 800;
    color: #ffffff;
}

.logo span {
    color: #6c5ce7;
}

.header-right {
    display: flex;
    gap: 10px;
}

.header-btn {
    border: none;
    background: #242541;
    color: white;

    padding: 10px 15px;
    border-radius: 8px;

    cursor: pointer;
    text-decoration: none;

    font-size: 13px;
    font-weight: 600;
}

.header-btn:hover {
    background: #6c5ce7;
}

/* ================= LAYOUT ================= */

.layout {
    display: flex;
    min-height: calc(100vh - 70px);
}

/* ================= SIDEBAR ================= */

.sidebar {
    width: 290px;
    background: #15162a;
    border-right: 1px solid #292a43;

    padding: 22px 18px;

    position: sticky;
    top: 70px;

    height: calc(100vh - 70px);
    overflow-y: auto;
}

.sidebar-title {
    font-size: 18px;
    font-weight: 800;
    margin-bottom: 6px;
}

.sidebar-subtitle {
    color: #9b9bad;
    font-size: 13px;
    margin-bottom: 20px;
}

.progress-container {
    background: #23243b;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 20px;
}

.progress-top {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #c8c8d4;
    margin-bottom: 8px;
}

.progress-bar {
    width: 100%;
    height: 8px;
    background: #30314b;
    border-radius: 20px;
    overflow: hidden;
}

.progress-fill {
    width: 0%;
    height: 100%;
    background: #6c5ce7;
    border-radius: 20px;
    transition: width 0.4s ease;
}

/* ================= LESSON BUTTON ================= */

.lesson {
    width: 100%;
    min-height: 48px;

    padding: 13px 14px;
    margin-bottom: 9px;

    border-radius: 10px;

    cursor: pointer;

    color: #d8d8df;
    background: #22233b;

    border: 1px solid #30314c;

    display: flex;
    align-items: center;

    transition: 0.2s ease;

    font-size: 14px;
    font-weight: 500;
}

.lesson:hover {
    background: #2c2d49;
    border-color: #45466b;
}

.lesson.active {
    background: #6c5ce7;
    color: white;
    border-color: #6c5ce7;
}

.lesson.completed {
    background: #22233b;
    color: #d8d8df;
    border: 1px solid #2ecc71;
}

.lesson.active.completed {
    background: #6c5ce7;
    color: white;
    border-color: #6c5ce7;
}

/* ================= MAIN ================= */

.main {
    flex: 1;
    padding: 35px;
    max-width: 1100px;
    margin: auto;
    width: 100%;
}

.course-heading {
    margin-bottom: 25px;
}

.course-heading h1 {
    font-size: 32px;
    margin-bottom: 8px;
}

.course-heading p {
    color: #a8a8b8;
    line-height: 1.6;
}

/* ================= LESSON CARD ================= */

.lesson-card {
    background: #18192d;

    border: 1px solid #292a45;
    border-radius: 16px;

    padding: 30px;

    box-shadow: 0 15px 40px rgba(0,0,0,0.15);

    animation: fadeIn 0.35s ease;
}

@keyframes fadeIn {

    from {
        opacity: 0;
        transform: translateY(10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

.lesson-number {
    color: #8c7cff;
    font-size: 13px;
    font-weight: 700;

    margin-bottom: 8px;
}

.lesson-card h2 {
    font-size: 27px;
    margin-bottom: 18px;
}

.explanation {
    color: #c7c7d2;
    line-height: 1.8;
    font-size: 15px;
}

/* ================= CODE ================= */

.code-box {
    background: #0d0e18;

    border: 1px solid #292a40;
    border-radius: 10px;

    padding: 18px;

    margin: 20px 0;

    overflow-x: auto;
}

.code-box pre {
    color: #d7d4ff;
    font-family: Consolas, monospace;
    font-size: 14px;
    line-height: 1.6;
}

/* ================= QUIZ ================= */

.quiz {
    margin-top: 30px;

    padding-top: 25px;

    border-top: 1px solid #2b2c45;
}

.quiz h3 {
    font-size: 19px;
    margin-bottom: 15px;
}

.option {
    background: #22233b;
    border: 1px solid #343550;

    border-radius: 9px;

    padding: 13px 15px;

    margin-bottom: 10px;

    cursor: pointer;

    transition: 0.2s ease;
}

.option:hover {
    border-color: #6c5ce7;
}

.option.selected {
    border-color: #6c5ce7;
    background: #2c2a50;
}

.option.correct {
    border-color: #2ecc71;
    background: #173722;
}

.option.wrong {
    border-color: #e74c3c;
    background: #3b1c1a;
}

.check-btn {
    margin-top: 12px;

    background: #6c5ce7;
    color: white;

    border: none;

    padding: 12px 20px;

    border-radius: 9px;

    cursor: pointer;

    font-weight: 700;
}

.check-btn:hover {
    background: #5b4bd6;
}

.feedback {
    margin-top: 15px;

    padding: 12px 15px;

    border-radius: 9px;

    display: none;

    font-size: 14px;
}

.feedback.correct-feedback {
    display: block;
    background: #15351f;
    color: #63e68a;
    border: 1px solid #26783d;
}

.feedback.wrong-feedback {
    display: block;
    background: #3b1b19;
    color: #ff8075;
    border: 1px solid #8d342c;
}

/* ================= NEXT BUTTON ================= */

.next-container {
    margin-top: 25px;
    display: flex;
    justify-content: flex-end;
}

.next-btn {
    border: none;

    background: #6c5ce7;
    color: white;

    padding: 12px 20px;

    border-radius: 9px;

    cursor: pointer;

    font-weight: 700;
}

.next-btn:hover {
    background: #5b4bd6;
}

/* ================= FINAL RESULT ================= */

.final-result {
    text-align: center;

    padding: 45px 25px;

    background: #18192d;

    border: 1px solid #292a45;

    border-radius: 16px;
}

.final-result .emoji {
    font-size: 60px;
}

.final-result h2 {
    margin-top: 15px;
    font-size: 30px;
}

.final-result p {
    margin-top: 10px;
    color: #aaaabd;
}

.certificate-btn {
    display: inline-block;

    margin-top: 25px;

    padding: 13px 22px;

    border-radius: 9px;

    background: #2ecc71;
    color: white;

    text-decoration: none;

    font-weight: 700;
}

.certificate-btn:hover {
    background: #27ae60;
}

.dashboard-btn {
    display: inline-block;

    margin-top: 12px;

    padding: 12px 20px;

    border-radius: 9px;

    background: #292a45;
    color: white;

    text-decoration: none;

    font-weight: 600;
}

/* ================= MOBILE ================= */

@media (max-width: 800px) {

    .layout {
        flex-direction: column;
    }

    .sidebar {
        width: 100%;
        height: auto;
        position: relative;
        top: 0;
    }

    .main {
        padding: 20px;
    }

    .lesson-card {
        padding: 22px;
    }

    .course-heading h1 {
        font-size: 26px;
    }

    .details {
        grid-template-columns: 1fr;
    }

}

</style>
</head>


<body>

    <div class="logo">

    </div>

<script>

/* =====================================================
   PYTHON COURSE DATA
===================================================== */

const lessons = [

    {

`age = 18

        question: "Which keyword is used to test a condition?",

        ],

    },


    {
        title: "Loops",
        explanation:
            "Loops are used to repeat a block of code. Python provides for and while loops.",
        code:

        question: "Which loop is commonly used to iterate over a sequence?",
        options: [

    },


    {

        explanation:
            "A list is an ordered and mutable collection of items. Lists can contain multiple values.",

`fruits = ["Apple", "Banana", "Orange"]

`numbers = (1, 2, 3)

student = Student("Jeshan")
student.show()`,

    },


    {

        explanation:
            "This final lesson combines Python concepts including variables, conditions, loops, functions and data structures. Completing this challenge demonstrates your overall Python learning.",

`def check_number(number):

    if number % 2 == 0:
        return "Even"
    else:
        return "Odd"

for number in range(1, 6):
    print(number, check_number(number))`,
        question: "What does the % operator return?",
        options: [

            "Remainder",

        ],
        answer: 1

];


/* =====================================================
   CURRENT LESSON
===================================================== */

let currentLesson = 1;

let selectedOption = null;

let answeredCurrent = false;


/* =====================================================
   SAFE LOCAL STORAGE
===================================================== */

function readJSON(key, fallback) {

    try {

        const value = localStorage.getItem(key);

        return value ? JSON.parse(value) : fallback;

    } catch (error) {

        return fallback;

    }

}


function getCompletedLessons() {

    return readJSON(
        "pythonCompletedLessonIds",
        []
    );

}


function getScores() {

    return readJSON(
        "pythonLessonScores",
        {}
    );

}


/* =====================================================
   CERTIFICATE DATA
===================================================== */

function createPythonCertificateDetails() {

    if (!localStorage.getItem("pythonCertificateDate")) {

        localStorage.setItem(
            "pythonCertificateDate",
            new Date().toLocaleDateString()
        );

    }


    if (!localStorage.getItem("pythonCertificateId")) {

        localStorage.setItem(
            "pythonCertificateId",
            "PY-" + Date.now().toString().slice(-8)
        );

    }

}


/* =====================================================
   LESSON LIST
===================================================== */

function renderLessonList() {

    const list =
        document.getElementById("lessonList");

    const completed =
        getCompletedLessons();

    list.innerHTML = "";


    lessons.forEach((lesson, index) => {

        const lessonNumber = index + 1;

        const button =
            document.createElement("div");

        button.className = "lesson";


        if (lessonNumber === currentLesson) {

            button.classList.add("active");

        }


        if (completed.includes(lessonNumber)) {

            button.classList.add("completed");

        }


        button.innerHTML =
            completed.includes(lessonNumber)

            ? `✓ Lesson ${lessonNumber}: ${lesson.title}`

            : `Lesson ${lessonNumber}: ${lesson.title}`;


        button.onclick = function() {

            currentLesson = lessonNumber;

            selectedOption = null;

            answeredCurrent = false;

            renderLessonList();

            renderLesson();

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        };


        list.appendChild(button);

    });

}


/* =====================================================
   PROGRESS
===================================================== */

function updateProgress() {

    const completed =
        getCompletedLessons();

    const percentage =
        Math.round(
            (completed.length / lessons.length) * 100
        );


    document.getElementById(
        "progressText"
    ).textContent =
        percentage + "%";


    document.getElementById(
        "progressFill"
    ).style.width =
        percentage + "%";

}


/* =====================================================
   RENDER LESSON
===================================================== */

function renderLesson() {

    const area =
        document.getElementById("lessonArea");

    const lesson =
        lessons[currentLesson - 1];

    const completed =
        getCompletedLessons();

    selectedOption = null;

    answeredCurrent = false;


    area.innerHTML = `

        <div class="lesson-card">

            <div class="lesson-number">
                LESSON ${currentLesson} OF ${lessons.length}
            </div>

            <h2>
                ${lesson.title}
            </h2>

            <div class="explanation">
                ${lesson.explanation}
            </div>

            <div class="code-box">
                <pre>${escapeHTML(lesson.code)}</pre>
            </div>


            <div class="quiz">

                <h3>
                    📝 Quick Quiz
                </h3>

                <p style="color:#aaa;margin-bottom:15px;">
                    ${lesson.question}
                </p>


                <div id="options">

                    ${lesson.options.map((option, index) => `

                        <div
                            class="option"
                            data-index="${index}"
                            onclick="selectOption(${index})">

                            ${String.fromCharCode(65 + index)}.
                            ${option}

                        </div>

                    `).join("")}

                </div>


                <button
                    class="check-btn"
                    onclick="checkAnswer()">

                    Check Answer

                </button>


                <div
                    id="feedback"
                    class="feedback">
                </div>


                <div
                    id="nextContainer"
                    class="next-container">
                </div>

            </div>

        </div>

    `;


    /* Already completed */

    if (completed.includes(currentLesson)) {

        const feedback =
            document.getElementById("feedback");

        feedback.textContent =
            "✓ You have already completed this lesson.";

        feedback.className =
            "feedback correct-feedback";

    }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================================
   SELECT OPTION
===================================================== */

function selectOption(index) {

    if (answeredCurrent) {
        return;
    }


    selectedOption = index;


    document.querySelectorAll(".option")
        .forEach(option => {

            option.classList.remove(
                "selected"
            );

        });


    const selected =
        document.querySelector(
            `.option[data-index="${index}"]`
        );


    if (selected) {

        selected.classList.add(
            "selected"
        );

    }

}


/* =====================================================
   CHECK ANSWER
===================================================== */

function checkAnswer() {

    if (selectedOption === null) {

        alert("Please select an answer first.");

        return;

    }


    if (answeredCurrent) {

        return;

    }


    const lesson =
        lessons[currentLesson - 1];

    const feedback =
        document.getElementById("feedback");

    const options =
        document.querySelectorAll(".option");


    answeredCurrent = true;


    options.forEach(option => {

        const index =
            Number(
                option.dataset.index
            );


        if (index === lesson.answer) {

            option.classList.add(
                "correct"
            );

        }


        if (
            index === selectedOption &&
            selectedOption !== lesson.answer
        ) {

            option.classList.add(
                "wrong"
            );

        }

    });


    if (selectedOption === lesson.answer) {

        feedback.textContent =
            "✓ Correct! Great job. This lesson is completed.";

        feedback.className =
            "feedback correct-feedback";


        completeLesson();

    } else {

        feedback.textContent =
            "✗ Incorrect. Please review the lesson and try again.";

        feedback.className =
            "feedback wrong-feedback";

        answeredCurrent = false;

    }

}


/* =====================================================
   COMPLETE LESSON
===================================================== */

function completeLesson() {

    let completed =
        getCompletedLessons();


    let scores =
        getScores();


    /* Prevent duplicate completion */

    if (!completed.includes(currentLesson)) {

        completed.push(currentLesson);

        localStorage.setItem(
            "pythonCompletedLessonIds",
            JSON.stringify(completed)
        );


        scores[currentLesson] = 1;

        localStorage.setItem(
            "pythonLessonScores",
            JSON.stringify(scores)
        );

    }


    renderLessonList();

    updateProgress();


    const nextContainer =
        document.getElementById(
            "nextContainer"
        );


    if (currentLesson < lessons.length) {

        nextContainer.innerHTML = `

            <button
                class="next-btn"
                onclick="nextLesson()">

                Next Lesson →

            </button>

        `;

    } else {

        /* ALL 15 COMPLETED */

        createPythonCertificateDetails();


        nextContainer.innerHTML = `

            <button
                class="next-btn"
                onclick="showFinalResult()">

                🏆 View Final Result

            </button>

        `;

    }

}


/* =====================================================
   NEXT LESSON
===================================================== */

function nextLesson() {

    if (
        currentLesson <
        lessons.length
    ) {

        currentLesson++;

        selectedOption = null;

        answeredCurrent = false;

        renderLessonList();

        renderLesson();

        updateProgress();

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    } else {

        showFinalResult();

    }

}


/* =====================================================
   FINAL RESULT
===================================================== */

function showFinalResult() {

    const completed =
        getCompletedLessons();

    const scores =
        getScores();


    if (completed.length < lessons.length) {

        alert(
            "Please complete all 15 lessons first."
        );

        return;

    }


    createPythonCertificateDetails();


    let totalScore = 0;


    for (let i = 1; i <= lessons.length; i++) {

        if (scores[i] !== undefined) {

            totalScore +=
                Number(scores[i]);

        }

    }


    let performance;


    if (totalScore >= 13) {

        performance =
            "Excellent! 🌟";

    } else if (totalScore >= 10) {

        performance =
            "Very Good! 👏";

    } else if (totalScore >= 8) {

        performance =
            "Good Work! 👍";

    } else {

        performance =
            "Keep Practising! 💪";

    }


    document.getElementById(
        "lessonArea"
    ).innerHTML = `

        <div class="final-result">

            <div class="emoji">
                🎉
            </div>

            <h2>
                Python Course Completed!
            </h2>

            <p>
                You successfully completed
                all ${lessons.length} Python lessons.
            </p>

            <p style="
                margin-top:20px;
                font-size:22px;
                color:#8c7cff;
                font-weight:800;
            ">
                Score: ${totalScore} / ${lessons.length}
            </p>

            <p>
                ${performance}
            </p>

            <p style="
                margin-top:18px;
                color:#63e68a;
                font-weight:700;
            ">
                ✓ Certificate Unlocked
            </p>


            <a
                href="certificate.html"
                class="certificate-btn">

                🎓 View Python Certificate

            </a>


            <br>


            <a
                href="dashboard.html"
                class="dashboard-btn">

                ← Back to Dashboard

            </a>

        </div>

    `;


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =====================================================
   CERTIFICATE BUTTON
===================================================== */

function viewCertificate() {

    window.location.href =
        "certificate.html";

}


/* =====================================================
   INITIAL LOAD
===================================================== */

function initialiseCourse() {

    const completed =
        getCompletedLessons();


    /* If already 15/15, make sure certificate data exists */

    if (completed.length >= lessons.length) {

        createPythonCertificateDetails();

    }


    renderLessonList();

    renderLesson();

    updateProgress();

}


initialiseCourse();

</script>

</html>
