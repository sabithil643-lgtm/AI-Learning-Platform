          content="width=device-width, initial-scale=1.0">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #0b0b18;
            color: #ffffff;
            min-height: 100vh;
        }

        /* =========================
           HEADER
        ========================== */

        header {
            height: 70px;
            padding: 0 30px;
            background: rgba(17, 17, 35, 0.95);
            border-bottom: 1px solid #29294a;

            display: flex;
            align-items: center;
            justify-content: space-between;

            position: sticky;
            top: 0;
            z-index: 1000;

            backdrop-filter: blur(12px);
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
        }

        .logo span {
            color: #8b5cf6;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .header-btn {
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 9px;

            color: white;
            border: 1px solid #3a3a5d;
            background: #1c1c32;

            transition: 0.3s;
            font-size: 14px;
        }

        .header-btn:hover {
            background: #8b5cf6;
            border-color: #8b5cf6;
            transform: translateY(-2px);
        }


        /* =========================
           MAIN LAYOUT
        ========================== */

        .course-layout {
            display: grid;
            grid-template-columns: 310px 1fr;

            min-height: calc(100vh - 70px);
        }


        /* =========================
           SIDEBAR
        ========================== */

        .sidebar {
            background: #111122;
            border-right: 1px solid #29294a;

            padding: 25px 18px;

            position: sticky;
            top: 70px;

            height: calc(100vh - 70px);

            overflow-y: auto;
        }

        .sidebar h2 {
            font-size: 21px;
            margin-bottom: 7px;
        }

        .sidebar-subtitle {
            color: #9999b2;
            font-size: 13px;
            margin-bottom: 20px;
        }


        /* =========================
           PROGRESS
        ========================== */

        .progress-container {
            background: #1c1c32;
            border: 1px solid #30304d;

            border-radius: 12px;
            padding: 15px;

            margin-bottom: 22px;
        }

        .progress-top {
            display: flex;
            justify-content: space-between;

            margin-bottom: 9px;

            font-size: 13px;
        }

        .progress-percent {
            color: #a78bfa;
            font-weight: bold;
        }

        .progress-bar {
            width: 100%;
            height: 8px;

            background: #292940;

            border-radius: 10px;

            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;

            background: linear-gradient(
                90deg,
                #7c3aed,
                #a855f7
            );

            border-radius: 10px;

            transition: width 0.4s ease;
        }


        /* =========================
           LESSON LIST
        ========================== */

        .lesson-list {
            display: flex;
            flex-direction: column;
        }

        .lesson {
            width: 100%;
            min-height: 48px;

            padding: 13px 14px;
            margin-bottom: 9px;

            border-radius: 10px;

            cursor: pointer;

            color: #d8d8df;

            background: #22223b;

            border: 1px solid #30304c;

            display: flex;
            align-items: center;

            transition: 0.2s ease;

            font-size: 14px;
            font-weight: 500;
        }

        .lesson:hover {
            background: #2c2c4a;
            border-color: #6d5ce7;

            transform: translateX(3px);
        }

        .lesson.active {
            background: #7c3aed;
            color: white;
            border-color: #7c3aed;
        }

        .lesson.completed {
            background: #22223b;
            color: #d8d8df;

            border: 1px solid #2ecc71;
        }

        .lesson.active.completed {
            background: #7c3aed;
            color: white;
            border-color: #7c3aed;
        }


        /* =========================
           CONTENT
        ========================== */

        .content {
            padding: 40px;

            max-width: 1000px;
            width: 100%;

            margin: auto;
        }

        .course-heading {
            margin-bottom: 30px;
        }

        .course-heading .tag {
            display: inline-block;

            padding: 7px 12px;

            background: rgba(124, 58, 237, 0.15);

            color: #b794ff;

            border: 1px solid rgba(124, 58, 237, 0.4);

            border-radius: 20px;

            font-size: 12px;

            margin-bottom: 14px;
        }

        .course-heading h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .course-heading p {
            color: #a4a4bb;
            line-height: 1.7;
        }


        /* =========================
           LESSON CARD
        ========================== */

        .lesson-card {
            background:
                linear-gradient(
                    145deg,
                    #15152b,
                    #101020
                );

            border: 1px solid #2b2b48;

            border-radius: 18px;

            padding: 32px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .lesson-number {
            color: #a78bfa;

            font-size: 13px;
            font-weight: bold;

            margin-bottom: 8px;

            text-transform: uppercase;

            letter-spacing: 1px;
        }

        .lesson-card h2 {
            font-size: 29px;

            margin-bottom: 20px;
        }

        .lesson-card p {
            color: #c1c1d1;

            line-height: 1.8;

            margin-bottom: 15px;
        }

        .lesson-card h3 {
            margin-top: 28px;
            margin-bottom: 12px;

            color: #ffffff;
        }


        /* =========================
           CODE BOX
        ========================== */

        .code-box {
            background: #080810;

            border: 1px solid #303047;

            border-radius: 12px;

            padding: 20px;

            margin: 18px 0;

            overflow-x: auto;
        }

        .code-box pre {
            color: #c4b5fd;

            font-family: Consolas, monospace;

            line-height: 1.7;

            white-space: pre-wrap;
        }


        /* =========================
           KEY POINTS
        ========================== */

        .points {
            background: rgba(124, 58, 237, 0.08);

            border-left: 4px solid #8b5cf6;

            padding: 18px 20px;

            border-radius: 10px;

            margin-top: 20px;
        }

        .points li {
            color: #d2d2df;

            margin: 9px 0;

            margin-left: 18px;
        }


        /* =========================
           QUIZ
        ========================== */

        .quiz-box {
            margin-top: 30px;

            padding: 25px;

            border-radius: 15px;

            background: #19192e;

            border: 1px solid #30304c;
        }

        .quiz-box h3 {
            margin-top: 0;

            font-size: 21px;
        }

        .question {
            color: #eeeeff;

            margin-bottom: 18px;

            line-height: 1.6;
        }

        .options {
            display: flex;
            flex-direction: column;

            gap: 10px;
        }

        .option {
            padding: 14px 16px;

            background: #23233c;

            border: 1px solid #343452;

            border-radius: 10px;

            color: #dddded;

            cursor: pointer;

            transition: 0.25s;
        }

        .option:hover {
            background: #303052;

            border-color: #8b5cf6;
        }

        .option.selected {
            background: #33245e;

            border-color: #9b6cff;
        }

        .option.disabled {
            cursor: not-allowed;

            opacity: 0.65;
        }


        /* =========================
           BUTTONS
        ========================== */

        .submit-btn,
        .next-btn,
        .dashboard-btn,
        .certificate-btn {

            margin-top: 18px;

            padding: 12px 20px;

            border: none;

            border-radius: 9px;

            color: white;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .submit-btn {
            background: #7c3aed;
        }

        .next-btn {
            background: #2563eb;
        }

        .dashboard-btn {
            background: #303047;
        }

        .certificate-btn {
            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #a855f7
                );

            padding: 14px 25px;

            font-size: 15px;
        }

        .submit-btn:hover,
        .next-btn:hover,
        .dashboard-btn:hover,
        .certificate-btn:hover {

            transform: translateY(-2px);

            opacity: 0.9;
        }

        .submit-btn:disabled {
            cursor: not-allowed;

            opacity: 0.5;

            transform: none;
        }


        /* =========================
           FEEDBACK
        ========================== */

        .feedback {
            margin-top: 15px;

            padding: 13px;

            border-radius: 9px;

            display: none;

            line-height: 1.5;
        }

        .feedback.correct {
            display: block;

            background: rgba(46, 204, 113, 0.12);

            border: 1px solid #2ecc71;

            color: #72f5a5;
        }

        .feedback.wrong {
            display: block;

            background: rgba(231, 76, 60, 0.12);

            border: 1px solid #e74c3c;

            color: #ff8f85;
        }


        /* =========================
           COMPLETED MESSAGE
        ========================== */

        .completed-message {
            margin-top: 18px;

            padding: 14px 16px;

            border-radius: 10px;

            background: rgba(46, 204, 113, 0.10);

            border: 1px solid #2ecc71;

            color: #72f5a5;

            line-height: 1.6;
        }


        /* =========================
           FINAL RESULT
        ========================== */

            text-align: center;

            padding: 50px 20px;
        }

            font-size: 34px;

            color: #c4b5fd;

            margin-bottom: 15px;
        }

        .final-result p {
            color: #bdbdd0;
        }

            font-size: 70px;

            font-weight: bold;

            margin: 25px 0;

            background:
                linear-gradient(
                    90deg,
                    #8b5cf6,
                    #c084fc
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;
        }

           RESPONSIVE
        ========================== */

        @media (max-width: 850px) {

            .course-layout {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: relative;

                top: 0;

                height: auto;

                border-right: none;

            }

            .course-heading h1 {
                font-size: 30px;

        }

            header {
                padding: 0 15px;
            }

            .logo {
                font-size: 18px;
            }

            .header-btn {
                padding: 8px 10px;

                font-size: 12px;
            }

            .lesson-list {
                grid-template-columns: 1fr;
            }

            .lesson-card {
                padding: 22px;
            }

            .lesson-card h2 {
                font-size: 24px;
            }

            .final-score {
                font-size: 55px;
            }
        }

    </style>

</head>

                industries and its applications continue to grow.
            </p>

            <h3>
                Major Applications
            </h3>

            <div class="points">

                <ul>

                    <li>Healthcare</li>

                    <li>Education</li>

                    <li>Finance</li>

                    <li>Transportation</li>

                    <li>Cybersecurity</li>

                    <li>Entertainment</li>

                </ul>

            </div>

            <p>
                Future AI systems are expected to become more useful,
                efficient and integrated into everyday technology.
            </p>

        `,

        question:
            "Where can AI be used?",

        options: [

            "Many different industries",

            "Only schools",

            "Only games",

            "Only banks"

        ],

        answer: 0
    },


    {
        id: 15,

        title:
            "Final AI Challenge",

        content: `

            <p>
                🎉 Congratulations! You have reached the final
                lesson of the Artificial Intelligence course.
            </p>

            <p>
                You have explored AI fundamentals, Machine Learning,
                neural networks, Computer Vision, NLP, Generative AI
                and responsible AI.
            </p>

            <div class="points">

                <ul>

                    <li>Review the previous lessons.</li>

                    <li>Think about real-world AI applications.</li>

                    <li>Complete the final challenge.</li>

                    <li>Check your final course score.</li>

                </ul>

            </div>

        `,

        question:
            "Which technology is a major area of modern AI?",

        options: [

            "Machine Learning",

            "Paper printing only",

            "Manual typing only",

            "Traditional filing only"

        ],

        answer: 0
    }

];


/* ==========================================
   LOCAL STORAGE FUNCTIONS
========================================== */

function getCompletedLessons() {

    try {

        return JSON.parse(
            localStorage.getItem(
                "aiCompletedLessonIds"
            ) || "[]"
        );

    } catch (error) {

        return [];

    }

}


function getScores() {

    try {

        return JSON.parse(
            localStorage.getItem(
                "aiLessonScores"
            ) || "{}"
        );

    } catch (error) {

        return {};

    }

}


function saveCompletedLessons(data) {

    localStorage.setItem(
        "aiCompletedLessonIds",
        JSON.stringify(data)
    );

}


function saveScores(data) {

    localStorage.setItem(
        "aiLessonScores",
        JSON.stringify(data)
    );

}


/* ==========================================
   CERTIFICATE INFORMATION
========================================== */

function createCertificateDetails() {

    const completed =
        getCompletedLessons();

    if (completed.length !== lessons.length) {
        return;
    }


    /* Certificate date */

    if (!localStorage.getItem("aiCertificateDate")) {

        const today =
            new Date();

        const date =
            today.toLocaleDateString(
                "en-GB"
            );

        localStorage.setItem(
            "aiCertificateDate",
            date
        );

    }


    /* Certificate ID */

    if (!localStorage.getItem("aiCertificateId")) {

        const randomNumber =
            Math.floor(
                100000 +
                Math.random() * 900000
            );

        const certificateId =
            "AI-" + randomNumber;

        localStorage.setItem(
            "aiCertificateId",
            certificateId
        );

    }

}


/* ==========================================
   CURRENT LESSON
========================================== */

let currentLesson = 1;

let selectedAnswer = null;

let answeredCurrent = false;


/* ==========================================
   CREATE LESSON SIDEBAR
========================================== */

function renderLessonList() {

    const list =
        document.getElementById(
            "lessonList"
        );

    const completed =
        getCompletedLessons();

    list.innerHTML = "";


    lessons.forEach(lesson => {

        const button =
            document.createElement("div");

        button.className = "lesson";


        if (lesson.id === currentLesson) {

            button.classList.add(
                "active"
            );

        }


        if (
            completed.includes(
                lesson.id
            )
        ) {

            button.classList.add(
                "completed"
            );

        }


        button.textContent =
            completed.includes(lesson.id)

                ? "✓ Completed " +
                  lesson.id +
                  ". " +
                  lesson.title

                : lesson.id +
                  ". " +
                  lesson.title;


        button.onclick = function () {

            currentLesson =
                lesson.id;

            selectedAnswer =
                null;

            answeredCurrent =
                false;

            renderLessonList();

            renderLesson();

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        };


        list.appendChild(button);

    });

}


/* ==========================================
   UPDATE PROGRESS
========================================== */

function updateProgress() {

    const completed =
        getCompletedLessons();


    const percentage =
        Math.round(
            (
                completed.length /
                lessons.length
            ) * 100
        );


    document.getElementById(
        "progressPercent"
    ).textContent =
        percentage + "%";


    document.getElementById(
        "progressFill"
    ).style.width =
        percentage + "%";

}


/* ==========================================
   RENDER LESSON
========================================== */

function renderLesson() {

    const lesson =
        lessons.find(
            item =>
                item.id === currentLesson
        );


    if (!lesson) {
        return;
    }


    selectedAnswer = null;

    answeredCurrent = false;


    const completed =
        getCompletedLessons();


    const alreadyCompleted =
        completed.includes(
            lesson.id
        );


    const content =
        document.getElementById(
            "lessonContent"
        );


    content.innerHTML = `

        <div class="lesson-card">

            <div class="lesson-number">

                Lesson ${lesson.id}
                of ${lessons.length}

            </div>


            <h2>
                ${lesson.title}
            </h2>


            ${lesson.content}


            <div class="quiz-box">

                <h3>
                    📝 Quick Quiz
                </h3>


                <p class="question">

                    <strong>
                        ${lesson.question}
                    </strong>

                </p>


                <div
                    class="options"
                    id="options"
                >

                    ${lesson.options.map(
                        (option, index) => `

                            <div
                                class="option ${
                                    alreadyCompleted
                                        ? "disabled"
                                        : ""
                                }"
                                ${
                                    alreadyCompleted
                                        ? ""
                                        : `onclick="selectOption(${index})"`
                                }
                            >

                                ${String.fromCharCode(
                                    65 + index
                                )}.
                                ${option}

                            </div>

                    `
                    ).join("")}

                </div>


                ${
                    alreadyCompleted

                    ? `

                        <div class="completed-message">

                            ✓ This lesson has already
                            been completed successfully.

                            <br>

                            Your completion has been saved
                            and will not be counted again.

                        </div>

                        <button
                            class="next-btn"
                            onclick="nextLesson()"
                        >

                            ${
                                currentLesson ===
                                lessons.length

                                ? "View Final Result →"

                                : "Next Lesson →"
                            }

                        </button>

                    `

                    : `

                        <button
                            class="submit-btn"
                            id="submitButton"
                            onclick="checkAnswer()"
                        >

                            Check Answer

                        </button>

                        <div
                            id="feedback"
                            class="feedback"
                        ></div>

                    `
                }

            </div>

        </div>

    `;


    if (alreadyCompleted) {

        answeredCurrent = true;

    }

}


/* ==========================================
   SELECT ANSWER
========================================== */

function selectOption(index) {

    if (answeredCurrent) {
        return;
    }


    selectedAnswer =
        index;


    const options =
        document.querySelectorAll(
            ".option"
        );


    options.forEach(option => {

        option.classList.remove(
            "selected"
        );

    });


    if (options[index]) {

        options[index].classList.add(
            "selected"
        );

    }

}


/* ==========================================
   CHECK ANSWER
========================================== */

function checkAnswer() {

    if (answeredCurrent) {
        return;
    }


    const feedback =
        document.getElementById(
            "feedback"
        );


    if (!feedback) {
        return;
    }


    if (selectedAnswer === null) {

        feedback.textContent =
            "⚠️ Please select an answer first.";

        feedback.className =
            "feedback wrong";

        return;

    }


    const lesson =
        lessons.find(
            item =>
                item.id === currentLesson
        );


    if (!lesson) {
        return;
    }


    if (
        selectedAnswer ===
        lesson.answer
    ) {

        answeredCurrent = true;


        feedback.textContent =
            "🎉 Correct! Excellent work.";


        feedback.className =
            "feedback correct";


        const submitButton =
            document.getElementById(
                "submitButton"
            );


        if (submitButton) {

            submitButton.disabled =
                true;

        }


        completeLesson();

    }

    else {

        feedback.textContent =
            "❌ Incorrect. Please review the lesson and try again.";

        feedback.className =
            "feedback wrong";

    }

}


/* ==========================================
   COMPLETE LESSON
========================================== */

function completeLesson() {

    let completed =
        getCompletedLessons();


    let scores =
        getScores();


    /*
       IMPORTANT:
       Prevent duplicate completion.
    */

    if (
        completed.includes(
            currentLesson
        )
    ) {

        updateProgress();

        renderLessonList();

        return;

    }


    /*
       Add lesson only once.
    */

    completed.push(
        currentLesson
    );


    completed.sort(
        (a, b) => a - b
    );


    /*
       Every lesson currently
       gives 1 point.
    */

    scores[currentLesson] = 1;


    saveCompletedLessons(
        completed
    );


    saveScores(
        scores
    );


    updateProgress();

    renderLessonList();


    /*
       Create certificate information
       when all 15 lessons are done.
    */

    if (
        completed.length ===
        lessons.length
    ) {

        createCertificateDetails();


        setTimeout(
            () => {

                showFinalResult();

            },
            700
        );

    }

    else {

        /*
           Add Next Lesson button.
        */

        const quizBox =
            document.querySelector(
                ".quiz-box"
            );


        if (quizBox) {

            const existingNext =
                quizBox.querySelector(
                    ".next-btn"
                );


            if (!existingNext) {

                const button =
                    document.createElement(
                        "button"
                    );


                button.className =
                    "next-btn";


                button.textContent =
                    "Next Lesson →";


                button.onclick =
                    nextLesson;


                quizBox.appendChild(
                    button
                );

            }

        }

    }

}


/* ==========================================
   NEXT LESSON
========================================== */

function nextLesson() {

    if (
        currentLesson <
        lessons.length
    ) {

        currentLesson++;

        selectedAnswer =
            null;

        answeredCurrent =
            false;


        renderLessonList();

        renderLesson();


        window.scrollTo({

            top: 0,

            behavior: "smooth"

        });

    }

    else {

        showFinalResult();

    }

}


/* ==========================================
   FINAL RESULT
========================================== */

function showFinalResult() {

    const completed =
        getCompletedLessons();


    /*
       Only show final result after
       all lessons are complete.
    */

    if (
        completed.length !==
        lessons.length
    ) {

        return;

    }


    const scores =
        getScores();


    let totalScore = 0;


    for (
        let i = 1;
        i <= lessons.length;
        i++
    ) {

        if (
            scores[i] !== undefined
        ) {

            totalScore +=
                Number(
                    scores[i]
                );

        }

    }


    createCertificateDetails();


    let resultMessage = "";


    if (totalScore >= 13) {

        resultMessage =
            "Excellent! You have a strong understanding of Artificial Intelligence.";

    }

    else if (totalScore >= 10) {

        resultMessage =
            "Very Good! You have completed the AI learning path successfully.";

    }

    else if (totalScore >= 8) {

        resultMessage =
            "Good Work! Keep practising AI concepts to improve further.";

    }

    else {

        resultMessage =
            "Keep Practising! Review the lessons and strengthen your AI fundamentals.";

    }


    document.getElementById(
        "lessonContent"
    ).innerHTML = `

        <div class="lesson-card">

            <div class="final-result">

                <h2>
                    🎉 AI Course Completed!
                </h2>


                <p>
                    Congratulations!
                    You completed all
                    ${lessons.length}
                    AI lessons.
                </p>


                <div class="final-score">

                    ${totalScore}
                    /
                    ${lessons.length}

                </div>


                <p>
                    ${resultMessage}
                </p>


                <p style="margin-top:12px;">

                    Completed Lessons:

                    <strong>
                        ${completed.length}
                        /
                        ${lessons.length}
                    </strong>

                </p>


                <button
                    class="certificate-btn"
                    onclick="viewCertificate()"
                >

                    🏆 View AI Certificate

                </button>


                <br>


                <button
                    class="dashboard-btn"
                    onclick="goDashboard()"
                >

                    ← Go to Dashboard

                </button>

            </div>

        </div>

    `;

}


/* ==========================================
   CERTIFICATE
========================================== */

function viewCertificate() {

    const completed =
        getCompletedLessons();


    if (
        completed.length !==
        lessons.length
    ) {

        alert(
            "🔒 Please complete all 15 AI lessons to unlock your certificate."
        );

        return;

    }


    createCertificateDetails();


    window.location.href =
        "ai-certificate.html";

}


/* ==========================================
   DASHBOARD
========================================== */

function goDashboard() {

    window.location.href =
        "dashboard.html";

}


/* ==========================================
   INITIAL LOAD
========================================== */

function initializeCourse() {

    const completed =
        getCompletedLessons();


    updateProgress();

    renderLessonList();


    /*
       If course is already completed,
       create certificate information.
    */

    if (
        completed.length ===
        lessons.length
    ) {

        createCertificateDetails();

        renderLesson();

    }

    else {

        renderLesson();

    }

}


initializeCourse();

</script>
